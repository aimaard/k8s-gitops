apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
spec:
  project: infra
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: 'https://charts.jetstack.io'
      chart: cert-manager
      targetRevision: v1.21.1
      helm:
        valueFiles:
          - $values/values/cert-manager.yaml
    - repoURL: 'https://github.com/aimaard/k8s-gitops.git'
      targetRevision: main
      ref: values
      path: resources/cert-manager
