apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matrix
spec:
  project: apps
  destination:
    namespace: matrix
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: ghcr.io/element-hq/ess-helm
      chart: matrix-stack
      targetRevision: 26.10.4
      helm:
        releaseName: matrix-stack
        valueFiles:
          - '$values/values/matrix-stack.yaml'
    - repoURL: 'https://github.com/aimaard/k8s-gitops.git'
      path: charts/mautrix-whatsapp
      targetRevision: main
      helm:
        releaseName: mautrix-whatsapp
        valueFiles:
          - '$values/values/mautrix-whatsapp.yaml'
    - repoURL: 'https://github.com/aimaard/k8s-gitops.git'
      targetRevision: main
      ref: values
      path: resources/matrix
