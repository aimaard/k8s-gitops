apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade-controller
spec:
  project: on-prem-infra
  destination:
    namespace: system-upgrade
    name: bootc
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
  sources:
    - repoURL: 'https://github.com/rancher/system-upgrade-controller.git'
      targetRevision: v0.20.2
      path: .
      kustomize:
        patches:
          # SELinux blocks container_t from reading the host CA bundle (cert_t)
          # mounted from /etc/pki, so the controller can't resolve the channel.
          - target:
              kind: Deployment
              name: system-upgrade-controller
            patch: |-
              - op: add
                path: /spec/template/spec/securityContext/seLinuxOptions
                value:
                  type: spc_t
    - repoURL: 'https://github.com/rancher/system-upgrade-controller.git'
      targetRevision: v0.20.2
      path: pkg/crds/yaml/generated
    - repoURL: 'https://github.com/aimaard/k8s-gitops.git'
      targetRevision: main
      path: resources/on-prem/system-upgrade
