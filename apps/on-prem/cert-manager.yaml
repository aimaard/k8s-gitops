apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-on-prem
spec:
  project: on-prem-infra
  destination:
    namespace: cert-manager
    name: bootc
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      # ClusterIssuer / OnePasswordItem CRDs come from this chart and 1password-connect.
      - SkipDryRunOnMissingResource=true
  sources:
    - repoURL: 'https://charts.jetstack.io'
      chart: cert-manager
      targetRevision: v1.21.3
      helm:
        valueFiles:
          - $values/values/cert-manager.yaml
    - repoURL: 'https://github.com/aimaard/k8s-gitops.git'
      targetRevision: main
      ref: values
      path: resources/on-prem/cert-manager
