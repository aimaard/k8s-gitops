apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
spec:
  project: on-prem-apps
  destination:
    namespace: hermes
    name: bootc
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: 'https://github.com/aimaard/k8s-gitops.git'
    targetRevision: main
    path: resources/on-prem/hermes
