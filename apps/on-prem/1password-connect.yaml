apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 1password-connect-on-prem
spec:
  project: on-prem-infra
  destination:
    namespace: kube-system
    name: bootc
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: 'https://1password.github.io/connect-helm-charts'
      chart: connect
      targetRevision: 2.4.3
      helm:
        valueFiles:
          - '$values/values/on-prem/1password-connect.yaml'
    - repoURL: 'https://github.com/aimaard/k8s-gitops.git'
      ref: values
