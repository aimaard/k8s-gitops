apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
spec:
  project: on-prem-infra
  destination:
    namespace: envoy-gateway-system
    name: bootc
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      # The Gateway API CRDs are too large for client-side apply.
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  sources:
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.9.2
    - repoURL: 'https://github.com/aimaard/k8s-gitops.git'
      targetRevision: main
      path: resources/on-prem/envoy-gateway
