apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # "envoy-gateway" is taken by the on-prem app.
  name: envoy-gateway-cloud
spec:
  project: infra
  destination:
    namespace: envoy-gateway-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  sources:
    # Infomaniak's managed Kubernetes doesn't ship the Gateway API CRDs, so they're installed here.
    - repoURL: docker.io/envoyproxy
      chart: gateway-crds-helm
      targetRevision: 1.9.3
      helm:
        valuesObject:
          crds:
            gatewayAPI:
              enabled: true
              channel: standard
            envoyGateway:
              enabled: true
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: 1.9.3
      helm:
        skipCrds: true
        valueFiles:
          - '$values/values/envoy-gateway.yaml'
    - repoURL: 'https://github.com/aimaard/k8s-gitops.git'
      targetRevision: main
      ref: values
      path: resources/envoy-gateway
