# Add for idempotency in ArgoCD, the password is not actually used.
wordpressPassword: "__unused__"

service:
  type: ClusterIP

resourcesPreset: none
persistence:
  size: 4Gi
# The data volume is ReadWriteOnce on DO block storage, which attaches to one node
# at a time: a rolling update deadlocks when the new pod lands on the other node.
updateStrategy:
  type: Recreate

mariadb:
  auth:
    existingSecret: mariadb-credentials
  primary:
    resourcesPreset: none
    persistence:
      size: 500Mi

httpRoute:
  enabled: true
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - arnold.siegrist.io
