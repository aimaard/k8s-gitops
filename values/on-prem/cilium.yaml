ipam:
  operator:
    clusterPoolIPv4PodCIDRList: "10.42.0.0/16"

cni:
  binPath: /var/opt/cni/bin
  exclusive: false

operator:
  replicas: 1

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  # Generate certs in-cluster instead of on every helm render, which keeps
  # the Argo app OutOfSync.
  tls:
    auto:
      method: cronJob
