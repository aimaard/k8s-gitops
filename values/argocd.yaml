global:
  domain: argocd.siegrist.io

configs:
  params:
    server.insecure: true
    # Let the API server compute diffs, so fields it defaults (e.g. Gateway API parentRefs group/kind)
    # don't show up as permanently OutOfSync.
    controller.diff.server.side: true
  rbac:
    policy.csv: |
      g, siegy22-org:default, role:admin
  cm:
    admin.enabled: false
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: Ov23lipIzUYuJsVUBdWM
            clientSecret: $gh-oauth:dex.github.clientSecret
            orgs:
              - name: siegy22-org

controller:
  volumes:
    - name: wireguard-secret
      secret:
        secretName: wireguard
  extraContainers:
    - image: linuxserver/wireguard:latest
      name: wireguard
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
        privileged: true
      volumeMounts:
        - mountPath: "/config/wg_confs"
          name: wireguard-secret

server:
  httproute:
    enabled: true
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - argocd.siegrist.io
