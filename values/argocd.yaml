global:
  domain: argocd.siegrist.io

configs:
  params:
    server.insecure: true
    # Let the API server compute diffs, so fields it defaults (e.g. Gateway API parentRefs group/kind)
    # don't show up as permanently OutOfSync.
    controller.diff.server.side: true
  rbac:
    policy.csv: |
      g, siegy22-org:default, role:admin
  cm:
    admin.enabled: false
    # Nothing serves Ingresses (Envoy Gateway only reads HTTPRoutes), so they never get an address and
    # would stay Progressing forever. matrix-stack renders them unconditionally.
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "Not served; traffic is routed with HTTPRoutes"
      return hs
    dex.config: |
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: Ov23lipIzUYuJsVUBdWM
            clientSecret: $gh-oauth:dex.github.clientSecret
            orgs:
              - name: siegy22-org

controller:
  volumes:
    - name: wireguard-secret
      secret:
        secretName: wireguard
  extraContainers:
    - image: linuxserver/wireguard:latest
      name: wireguard
      # Skips the image's init: the Ubuntu nodes' AppArmor profile for /usr/bin/wg-quick blocks it from
      # running the image's readlink, and on failure the init deletes the pod's default route.
      # Started through bash, the script runs unconfined.
      command:
        - bash
        - -c
        - bash /usr/bin/wg-quick up /config/wg_confs/wg0.conf && exec sleep infinity
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
        privileged: true
      volumeMounts:
        - mountPath: "/config/wg_confs"
          name: wireguard-secret

server:
  httproute:
    enabled: true
    parentRefs:
      - name: public
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - argocd.siegrist.io
