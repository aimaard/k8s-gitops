argoCD: true
serverName: 'siegrist.io'
publicServerName: 'matrix.siegrist.io'

signingkey:
  job:
    enabled: false

  existingSecret: signing-key

config:
  registrationSharedSecret: "@REGISTRATION_SHARED_SECRET@"

extraConfig:
  suppress_key_server_warning: true
  # Cached media from other servers is re-fetched on demand. Local media (incl.
  # everything the WhatsApp bridge stores) is kept.
  media_retention:
    remote_media_lifetime: 90d
  app_service_config_files:
    - /synapse/service_config_files/mautrix-whatsapp-registration.yaml

synapse:
  extraCommands:
    - sed -i -e 's/@REGISTRATION_SHARED_SECRET@/'"${REGISTRATION_SHARED_SECRET}"'/g' /synapse/config/conf.d/secrets.yaml
  extraEnv:
    - name: REGISTRATION_SHARED_SECRET
      valueFrom:
        secretKeyRef:
          name: registration-shared-secret
          key: REGISTRATION_SHARED_SECRET
  extraVolumes:
    - name: service-config-files
      secret:
        secretName: service-config-files
  extraVolumeMounts:
    - name: service-config-files
      readOnly: true
      mountPath: "/synapse/service_config_files"

wellknown:
  enabled: true

persistence:
  enabled: true
  size: 40Gi

postgresql:
  enabled: true
  existingSecret: postgresql-secret
  auth:
    existingSecret: postgresql-secret

  primary:
    persistence:
      size: 16Gi

redis:
  enabled: true
  auth:
    existingSecret: redis-secret

ingress:
  enabled: false

# Routes /_matrix, /_synapse and /.well-known/matrix on siegrist.io and matrix.siegrist.io.
gateway:
  enabled: true
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
