# Two controllers (leader election) on different nodes, so config updates keep flowing during node upgrades.
deployment:
  replicas: 2
  envoyGateway:
    resources:
      limits:
        memory: 1024Mi
      requests:
        cpu: 50m
        memory: 128Mi
  pod:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            control-plane: envoy-gateway
        matchLabelKeys:
          - pod-template-hash

podDisruptionBudget:
  minAvailable: 1
