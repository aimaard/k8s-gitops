# matrix-stack only renders Ingresses, which Envoy doesn't read; these mirror them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - matrix.siegrist.io
  rules:
    # Login is handled by the Matrix Authentication Service.
    - matches:
        - path: {type: PathPrefix, value: /_matrix/client/api/v1/login}
        - path: {type: PathPrefix, value: /_matrix/client/api/v1/refresh}
        - path: {type: PathPrefix, value: /_matrix/client/api/v1/logout}
        - path: {type: PathPrefix, value: /_matrix/client/r0/login}
        - path: {type: PathPrefix, value: /_matrix/client/r0/refresh}
        - path: {type: PathPrefix, value: /_matrix/client/r0/logout}
        - path: {type: PathPrefix, value: /_matrix/client/v3/login}
        - path: {type: PathPrefix, value: /_matrix/client/v3/refresh}
        - path: {type: PathPrefix, value: /_matrix/client/v3/logout}
        - path: {type: PathPrefix, value: /_matrix/client/unstable/login}
        - path: {type: PathPrefix, value: /_matrix/client/unstable/refresh}
        - path: {type: PathPrefix, value: /_matrix/client/unstable/logout}
      backendRefs:
        - name: matrix-stack-matrix-authentication-service
          port: 8080
    - matches:
        - path: {type: PathPrefix, value: /_matrix}
        - path: {type: PathPrefix, value: /_synapse}
      filters:
        # Synapse takes the first X-Forwarded-For entry, which the client controls; Envoy only
        # appends the real address. Replace the header with the address from the PROXY header.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
      backendRefs:
        - name: matrix-stack-synapse
          port: 8008
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-authentication-service
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - account.siegrist.io
  rules:
    - backendRefs:
        - name: matrix-stack-matrix-authentication-service
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: element-web
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - chat.siegrist.io
  rules:
    - backendRefs:
        - name: matrix-stack-element-web
          port: 80
---
# Delegates @user:siegrist.io to matrix.siegrist.io.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: well-known
  annotations:
    # about-me already publishes siegrist.io.
    external-dns.alpha.kubernetes.io/gateway-hostname-source: annotation-only
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - siegrist.io
  rules:
    - matches:
        - path: {type: PathPrefix, value: /.well-known/matrix}
      backendRefs:
        - name: matrix-stack-well-known
          port: 8010
