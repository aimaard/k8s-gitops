# Follows the k3s v1.37 channel: patch releases are applied automatically, the next minor
# needs this channel bumped (check Cilium's Kubernetes compatibility first).
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  serviceAccountName: system-upgrade
  channel: https://update.k3s.io/v1-release/channels/v1.37
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values: ["true"]
  tolerations:
    - operator: Exists
  upgrade:
    image: rancher/k3s-upgrade
