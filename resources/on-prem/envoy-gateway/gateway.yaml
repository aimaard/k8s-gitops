apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# Keeps the IP ingress-nginx had, so the UniFi DNS records stay valid.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: homeserver
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          metallb.io/loadBalancerIPs: 172.22.20.221
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homeserver
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: homeserver
  listeners:
    # Only serves the HTTPS redirect below.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.orion.siegrist.io"
      tls:
        mode: Terminate
        certificateRefs:
          - name: orion-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
---
# siegrist.io sends HSTS with includeSubDomains, so browsers insist on HTTPS anyway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: homeserver
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
