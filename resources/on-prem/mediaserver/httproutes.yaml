# The apps run with URL bases (/sonarr, ...), so routes forward the path unchanged.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media
  namespace: mediaserver
spec:
  parentRefs:
    - name: homeserver
      namespace: envoy-gateway-system
  hostnames:
    - media.orion.siegrist.io
  rules:
    - matches:
        - path: {type: PathPrefix, value: /sonarr}
      backendRefs:
        - {name: sonarr, port: 8989}
    - matches:
        - path: {type: PathPrefix, value: /radarr}
      backendRefs:
        - {name: radarr, port: 7878}
    - matches:
        - path: {type: PathPrefix, value: /prowlarr}
      backendRefs:
        - {name: prowlarr, port: 9696}
    - matches:
        - path: {type: PathPrefix, value: /sabnzbd}
      backendRefs:
        - {name: sabnzbd, port: 8080}
    - matches:
        - path: {type: PathPrefix, value: /transmission}
      backendRefs:
        - {name: transmission, port: 9091}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: mediaserver
spec:
  parentRefs:
    - name: homeserver
      namespace: envoy-gateway-system
  hostnames:
    - jellyfin.orion.siegrist.io
  rules:
    - backendRefs:
        - {name: jellyfin, port: 8096}
      # Video streams outlive Envoy's default route timeout.
      timeouts:
        request: 0s
