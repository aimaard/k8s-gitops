apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# Adopts the load balancer ingress-nginx disowned, so the public IP stays 209.38.183.48.
# https://github.com/digitalocean/digitalocean-cloud-controller-manager/blob/master/docs/controllers/services/examples/README.md#changing-ownership-of-a-load-balancer
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        annotations:
          kubernetes.digitalocean.com/load-balancer-id: 207cd624-10cc-4cce-a4a9-d24eaab0736a
          service.beta.kubernetes.io/do-loadbalancer-type: REGIONAL
      # One Envoy per node, so draining a node during a cluster upgrade always leaves one serving.
      envoyDeployment:
        replicas: 2
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  gateway.envoyproxy.io/owning-gateway-name: public
              matchLabelKeys:
                - pod-template-hash
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      envoyPDB:
        minAvailable: 1
  # The DO load balancer needs up to ~15s (3 failed checks every 3s, 5s timeout) to stop sending
  # traffic to a node whose Envoy is shutting down, so keep serving well past that.
  shutdown:
    minDrainDuration: 30s
    drainTimeout: 60s
---
# The single entry point for the cluster; apps attach HTTPRoutes to the https listener.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: envoy-gateway-system
  annotations:
    # The load balancer's IP, which stays the same when Envoy takes it over.
    external-dns.kubernetes.io/target: 209.38.183.48
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: public
  listeners:
    # Only serves the HTTPS redirect below.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: siegrist-io-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
