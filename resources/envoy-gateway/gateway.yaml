apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# The Octavia load balancer passes the client address to Envoy via PROXY protocol (see the
# ClientTrafficPolicy below), so apps see real source IPs in X-Forwarded-For.
# OCCM marks the address ipMode: Proxy, so in-cluster requests to it also go through the
# load balancer and carry the header instead of being short-circuited to Envoy.
# https://github.com/kubernetes/cloud-provider-openstack/blob/master/docs/openstack-cloud-controller-manager/expose-applications-using-loadbalancer-type-service.md
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        annotations:
          loadbalancer.openstack.org/proxy-protocol: "true"
          # Keeps the floating IP if the Service is ever recreated.
          loadbalancer.openstack.org/keep-floatingip: "true"
      # One Envoy per node, so draining a node during a cluster upgrade always leaves one serving.
      envoyDeployment:
        replicas: 2
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  gateway.envoyproxy.io/owning-gateway-name: public
              matchLabelKeys:
                - pod-template-hash
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      envoyPDB:
        minAvailable: 1
  # The load balancer's health checks need a few seconds to stop sending traffic to a node
  # whose Envoy is shutting down, so keep serving well past that.
  shutdown:
    minDrainDuration: 30s
    drainTimeout: 60s
---
# The single entry point for the cluster; apps attach HTTPRoutes to the https listener.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: public
  listeners:
    # Only serves the HTTPS redirect below.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: siegrist-io-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
---
# Every connection from the load balancer starts with a PROXY header; Envoy takes the client
# address from it. Connections without one are rejected.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
  proxyProtocol: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
