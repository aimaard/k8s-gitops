# Delegates @user:siegrist.io to matrix.siegrist.io while Matrix still runs on the old
# DigitalOcean cluster. Remove once matrix-stack serves the delegation itself.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: matrix-well-known-server
spec:
  directResponse:
    contentType: application/json
    body:
      type: Inline
      inline: '{"m.server":"matrix.siegrist.io:443"}'
    header:
      set:
        - name: Access-Control-Allow-Origin
          value: "*"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: matrix-well-known-client
spec:
  directResponse:
    contentType: application/json
    body:
      type: Inline
      inline: '{"m.homeserver":{"base_url":"https://matrix.siegrist.io/"}}'
    header:
      set:
        - name: Access-Control-Allow-Origin
          value: "*"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-well-known
  annotations:
    # about-me already publishes siegrist.io.
    external-dns.alpha.kubernetes.io/gateway-hostname-source: annotation-only
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - siegrist.io
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/matrix/server
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: matrix-well-known-server
    - matches:
        - path:
            type: Exact
            value: /.well-known/matrix/client
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: matrix-well-known-client
